# TBOX-SOMEIP 本地调试公共配置（CR-007 §2/§5）
# 仅用于本地开发、隔离 SOME/IP peer、单元/集成测试。
# config/dev/** 不由 someip-runtime 安装，不进入 Orin production rootfs/package。
# production /etc/tbox/common.yaml 由 BUILD 统一维护，SOMEIP 仓库不安装或覆盖。
common:
  log:
    schema_version: 1
    level: INFO
    strict: false
    async:
      enabled: true
      queue_size: 4096
      flush_interval_ms: 1000
    console:
      enabled: true
    file:
      enabled: false
      root: /var/log/tbox
      max_file_size_mb: 20
      max_files: 5
      total_budget_mb: 100
    redact:
      identifiers: mask
      raw_payload_max_bytes: 256

  # 持久化根路径（framework-store 使用）
  store:
    root: /var/lib/tbox
