# TBOX-SOMEIP 服务配置 - 部署到 /etc/tbox/conf.d/someip.yaml
# 覆盖 common.log.* 中的日志级别和模块级别
someip:
  # 服务实例配置
  enable_net_status: true
  enable_remote_cmd_relay: true
  enable_fota_relay: true

  # IPC 桥接配置 (CR-005/CR-006)：通过 TBOX 域 client facade 访问内部服务
  ipc_bridge:
    tsp_socket_path: /tmp/tbox-tsp.sock
    prov_socket_path: /tmp/tbox-prov.sock
    default_timeout_ms: 3000
    event_queue_size: 256

  # 服务级日志覆盖（someip.log.* 覆盖 common.log.*，见 src/main.cpp）
  log:
    type: console
    path: ./log.txt
    level: INFO
    modules:
      runtime: INFO
      sd: INFO
      method: DEBUG
      event: DEBUG
      ipc_bridge: INFO
      serializer: INFO
      fota_relay: INFO